<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>மாதாந்திர கணக்கு</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="மாதாந்திர கணக்கு">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#14302B;--mute:#5E736E;--line:#D5E0DC;--acc:#2F4BD8;--accink:#fff;--bad:#C2382B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A18;--card:#182623;--ink:#E6F0ED;--mute:#8FA6A0;--line:#2A3D39;--acc:#7C92FF;--accink:#101A18;--bad:#FF8A7D}}
:root[data-theme="dark"]{--bg:#101A18;--card:#182623;--ink:#E6F0ED;--mute:#8FA6A0;--line:#2A3D39;--acc:#7C92FF;--accink:#101A18;--bad:#FF8A7D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:1.1rem;margin:0;font-weight:600}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;flex:none}
.month{display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer}
.nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#mlabel{min-width:130px;text-align:center;font-weight:600}
.total{margin:8px 0 20px}
.total .amt{font-size:clamp(2.6rem,12vw,4.2rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.total .sub{color:var(--mute);margin-top:6px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
.bar.over>i{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:.95rem;margin:0 0 12px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.full{grid-column:1/-1}
.add{width:100%;padding:12px;border:0;border-radius:8px;background:var(--acc);color:var(--accink);font-weight:600}
.cat{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px;margin:8px 0;font-size:.9rem}
.cat .bar{margin:0;height:8px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{color:var(--mute);font-size:.8rem}
.del{border:0;background:none;color:var(--mute);font-size:1.2rem;padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:12px 0}
.budget{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.85rem;color:var(--mute)}
.budget input{width:110px;padding:6px 8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:.78rem;text-align:center;line-height:1.2}
.chip .ic{font-size:1.6rem;line-height:1.1}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--card);box-shadow:0 0 0 1px var(--acc)}
.ico{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--bg);font-size:1.25rem;flex:none}
.err{color:var(--bad);font-size:.8rem;margin-top:4px}
select.bad{border-color:var(--bad)}
.paste textarea{width:100%;min-height:110px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.btn2{padding:10px 14px;border:1px solid var(--acc);border-radius:8px;background:none;color:var(--acc);font-weight:600}
.pr{display:grid;grid-template-columns:auto 1fr 90px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:0}
.pr .ci{grid-column:2/-1;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pr input[type=checkbox]{width:20px;height:20px}
.pr input,.pr select{padding:7px 8px}
.pr .meta{grid-column:2/-1;font-size:.78rem;color:var(--mute)}
.pr.unk select{border-color:var(--bad)}
.pnote{color:var(--mute);font-size:.85rem;margin:8px 0 0}
.tog{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--acc);font-size:1.1rem;line-height:1;padding:0;flex:none}
.sms{flex-basis:100%;margin:0 0 4px 50px;background:var(--bg);padding:8px 10px;border-radius:8px;font-size:.82rem;color:var(--mute);white-space:pre-wrap;word-break:break-word}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--mute);font-size:.8rem}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;padding:0}
</style>
</head>

    <div class="month">
      <button class="nav" id="prev" aria-label="Previous month">‹</button>
      <span id="mlabel"></span>
      <button class="nav" id="next" aria-label="Next month">›</button>
    </div>
  </header>

  <section class="total">
    <div class="amt" id="total">₹0</div>
    <div class="sub" id="sub">Spent this month</div>
    <div class="bar" id="bbar" hidden><i></i></div>
    <div class="budget"><label for="budget" style="margin:0">Monthly budget ₹</label><input id="budget" type="number" min="0" inputmode="numeric" placeholder="Optional"></div>
  </section>

  <section class="card">
    <h2>Add an expense</h2>
    <div class="row">
      <div><label for="amount">Amount (₹)</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal"></div>
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div class="full"><label for="category">Category</label><select id="category"><option value="">Select a category…</option></select><div class="err" id="cerr" hidden>Choose a category to continue.</div></div>
      <div class="full"><label for="note">Note (optional)</label><input id="note" type="text" maxlength="60" placeholder="e.g. Groceries"></div>
      <div class="full"><button class="add" id="addBtn">Add expense</button></div>
    </div>
  </section>

  <section class="card paste">
    <h2>Paste payment messages</h2>
    <textarea id="sms" placeholder="Paste your bank / UPI SMS here. Put a blank line between messages."></textarea>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn2" id="readBtn">Read messages</button><button class="btn2" id="clearBtn" style="border-color:var(--line);color:var(--mute)">Clear</button></div>
    <div class="pnote" id="pnote" hidden></div>
    <div id="pend"></div>
    <button class="add" id="pAdd" style="margin-top:10px" hidden>Add selected expenses</button>
  </section>

  <section class="card">
    <h2>By category</h2>
    <div id="cats"></div>
  </section>

  <section class="card">
    <h2>Expenses</h2>
    <div id="list"></div>
  </section>

  <div class="foot"><span id="status">Checking where your data is saved…</span><span><button id="import">Import CSV</button> &nbsp; <button id="export">Download CSV</button></span><input type="file" id="csvfile" accept=".csv,text/csv" hidden></div>
</main>

<script>
var KEY="expenses-v1", BKEY="budget-v1";
var CATS=[["Petrol","⛽"],["Medical","💊"],["Recharges","📱"],["EB","⚡"],["Meat","🍗"],["Veggies","🥦"],["Groceries","🛒"],["Snacks","🍿"],["House work","🧹"],["Online shopping","🛍️"],["Other","🏷️"]];
var ICON={Food:"🍽️",Rent:"🏠",Transport:"🚌",Bills:"🧾",Shopping:"🛍️",Health:"💊",Fun:"🎉"};
CATS.forEach(function(c){ICON[c[0]]=c[1]});
var openSms={};
var items=[], budget=0, cur=new Date();
cur.setDate(1);
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||"[]");budget=+localStorage.getItem(BKEY)||0}catch(e){items=[];budget=0}}
var MSG="Saved on this phone. Download a CSV backup now and then.";
function setSt(t,bad){var e=document.getElementById("status");if(e){e.textContent=t;e.style.color=bad?"var(--bad)":"var(--mute)"}}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(BKEY,String(budget));setSt(MSG)}
  catch(e){setSt("Could not save on this phone. Download a CSV backup.",1)}
}
var $=function(id){return document.getElementById(id)};
var fmt=function(n){return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2})};
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var m=ym(cur);
  $("mlabel").textContent=cur.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  var list=items.filter(function(x){return x.date.slice(0,7)===m}).sort(function(a,b){return b.date.localeCompare(a.date)});
  var total=list.reduce(function(s,x){return s+x.amount},0);
  $("total").textContent=fmt(total);
  $("sub").textContent=list.length+(list.length===1?" expense":" expenses")+" this month";
  var bb=$("bbar");
  if(budget>0){bb.hidden=false;bb.className="bar"+(total>budget?" over":"");bb.firstElementChild.style.width=Math.min(100,total/budget*100)+"%";
    $("sub").textContent+=total>budget?" · "+fmt(total-budget)+" over budget":" · "+fmt(budget-total)+" left";}
  else bb.hidden=true;
  var by={};list.forEach(function(x){by[x.cat]=(by[x.cat]||0)+x.amount});
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  $("cats").innerHTML=keys.length?keys.map(function(k){return '<div class="cat"><span>'+(ICON[k]||"🏷️")+' '+esc(k)+'</span><div class="bar"><i style="width:'+(by[k]/total*100)+'%"></i></div><b>'+fmt(by[k])+'</b></div>'}).join(""):'<div class="empty">Nothing yet</div>';
  $("list").innerHTML=list.length?list.map(function(x){return '<div class="item"><span class="ico">'+(ICON[x.cat]||"🏷️")+'</span><div class="t"><b>'+esc(x.note||x.cat)+'</b><span>'+esc(x.cat)+' · '+new Date(x.date+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"})+'</span></div><b>'+fmt(x.amount)+'</b>'+(x.sms?'<button class="tog" data-t="'+x.id+'" aria-expanded="'+!!openSms[x.id]+'" aria-label="'+(openSms[x.id]?"Hide":"Show")+' original message">'+(openSms[x.id]?"−":"+")+'</button>':'')+'<button class="del" data-id="'+x.id+'" aria-label="Delete expense">×</button>'+(x.sms&&openSms[x.id]?'<div class="sms">'+esc(x.sms)+'</div>':'')+'</div>'}).join(""):'<div class="empty">No expenses this month. Add your first one above.</div>';
}
$("addBtn").onclick=function(){
  var a=parseFloat($("amount").value);
  if(!(a>0)){$("amount").focus();return}
  var cv=$("category").value;
  if(!cv){$("category").classList.add("bad");$("cerr").hidden=false;$("category").focus();return}
  items.push({id:Date.now()+""+Math.floor(Math.random()*999),amount:a,cat:cv,note:$("note").value.trim(),date:$("date").value||today()});
  save();
  var d=new Date(($("date").value||today())+"T00:00");d.setDate(1);cur=d;
  $("amount").value="";$("note").value="";$("category").value="";render();$("amount").focus();
};
$("list").onclick=function(e){var t=e.target.getAttribute("data-t");if(t){openSms[t]=!openSms[t];render();return}var id=e.target.getAttribute("data-id");if(id){items=items.filter(function(x){return x.id!==id});save();render()}};
$("prev").onclick=function(){cur.setMonth(cur.getMonth()-1);render()};
$("next").onclick=function(){cur.setMonth(cur.getMonth()+1);render()};
$("budget").onchange=function(){budget=Math.max(0,+this.value||0);save();render()};
$("export").onclick=function(){
  var rows=["Date,Category,Note,Amount,Message"].concat(items.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).map(function(x){return [x.date,x.cat,'"'+x.note.replace(/"/g,'""')+'"',x.amount,'"'+(x.sms||"").replace(/"/g,'""')+'"'].join(",")}));
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));a.download="expenses.csv";a.click();
};
$("category").innerHTML='<option value="">Select a category…</option>'+CATS.map(function(c){return '<option value="'+c[0]+'">'+c[1]+' '+(c[0]==="Recharges"?"Recharges (mobile & internet)":c[0])+'</option>'}).join("");
$("category").onchange=function(){this.classList.remove("bad");$("cerr").hidden=true};

var KW=[["Petrol","\\b(petrol|bunk|hpcl|bpcl|iocl|indian ?oil|fuel|diesel|nayara|shell)"],
["Medical","\\b(pharma|pharmacy|medic|hospital|clinic|apollo|diagnos|1mg|netmeds|doctor|dental|scan|lab)"],
["Recharges","\\b(jio|airtel|vodafone|bsnl|recharge|broadband|fibernet|hathway|excitel|dth|tata ?(play|sky)|vi)\\b"],
["EB","\\b(tneb|tangedco|tnpdcl|electricity|eb ?bill|bescom|kseb|msedcl|power ?bill)"],
["Meat","\\b(chicken|mutton|meat|fish|licious|freshtohome|prawn|egg)"],
["Veggies","\\b(veg|vegetable|fruit|greens|kai ?kari)"],
["Groceries","\\b(bigbasket|grocer|supermarket|dmart|d-mart|reliance ?(fresh|smart)|more ?retail|zepto|blinkit|instamart|nilgiri|kirana|provision|milk|aavin|store|mart)"],
["Snacks","\\b(snack|bakery|sweet|tea|coffee|cafe|juice|chat|ice ?cream|swiggy|zomato|biryani|hotel|restaurant)"],
["Online shopping","\\b(amazon|flipkart|myntra|meesho|ajio|nykaa|snapdeal|shopsy|tata ?cliq|online shopping)"],
["House work","\\b(maid|cook|clean|urban ?company|plumb|electrician|repair|carpent|laundry|housekeep|painter)"]];
var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
var pend=[];
function guess(t){t=t.toLowerCase();for(var i=0;i<KW.length;i++){if(new RegExp(KW[i][1],"i").test(t))return KW[i][0]}return ""}
function iso(y,m,d){y=+y;if(y<100)y+=2000;return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function pdate(t){
  var m=t.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m&&+m[2]<=12&&+m[1]<=31)return iso(m[3],m[2],m[1]);
  m=t.match(/(\d{1,2})[-\s]?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[-\s,]*(\d{2,4})?/i);
  if(m)return iso(m[3]||new Date().getFullYear(),MON[m[2].toLowerCase()],m[1]);
  return today();
}
function pparse(t){
  var low=t.toLowerCase();
  var a=t.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d+)?)/i);
  if(!a)return null;
  var amt=parseFloat(a[1].replace(/,/g,""));
  if(!(amt>0))return null;
  var credit=/credited|received|refund|deposited/.test(low)&&!/debited|paid|sent|spent|purchase|withdrawn/.test(low);
  var mm=t.match(/(?:\bto|\bat|@|\btowards)\s+(?:vpa\s+)?([A-Za-z][A-Za-z0-9 &'.\-]{1,28}?)(?=\s+(?:on|ref|via|using|from|upi|avl|bal|not|if)\b|[,.]\s|\s*$)/i);
  var note=mm?mm[1].trim():"";
  var cat=guess(t);
  return {amount:amt,date:pdate(t),note:note,cat:cat,credit:credit,raw:t.slice(0,300)};
}
function dupe(x){return items.some(function(i){return i.amount===x.amount&&i.date===x.date&&(i.note||"")===(x.note||"")})}
function catOpts(sel){return '<option value="">Choose category…</option>'+CATS.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===sel?" selected":"")+'>'+c[1]+' '+c[0]+'</option>'}).join("")}
function drawPend(){
  var box=$("pend");
  box.innerHTML=pend.map(function(x,i){
    return '<div class="pr'+(!x.cat&&x.on?" unk":"")+'" data-i="'+i+'"><input type="checkbox" data-f="on"'+(x.on?" checked":"")+' aria-label="Include"><input type="text" data-f="note" value="'+esc(x.note)+'" placeholder="Note"><input type="number" data-f="amount" value="'+x.amount+'" step="0.01"><div class="ci"><select data-f="cat">'+catOpts(x.cat)+'</select><input type="date" data-f="date" value="'+x.date+'"></div><div class="meta">'+(x.dup?"Already added · ":"")+(x.credit?"Looks like money received · ":"")+esc(x.raw.slice(0,90))+(x.raw.length>90?'…':'')+'</div></div>'}).join("");
  $("pAdd").hidden=!pend.length;
}
$("readBtn").onclick=function(){
  var txt=$("sms").value.trim();
  if(!txt){$("sms").focus();return}
  var chunks=txt.split(/\n\s*\n/);
  if(chunks.length===1){var ls=txt.split(/\n/).filter(function(l){return /(rs\.?|inr|₹)\s*[\d]/i.test(l)});if(ls.length>1)chunks=ls}
  var skipped=0;pend=[];
  chunks.forEach(function(c){
    var x=pparse(c.replace(/\s+/g," ").trim());
    if(!x){skipped++;return}
    x.dup=dupe(x);x.on=!x.credit&&!x.dup;pend.push(x);
  });
  var n=$("pnote");n.hidden=false;
  n.textContent=pend.length?"Found "+pend.length+(pend.length===1?" payment":" payments")+(skipped?" · "+skipped+" without an amount skipped":"")+". Check the details and pick a category for any marked in red.":"No amounts found. Messages should contain Rs, INR or ₹ with an amount.";
  drawPend();
};
$("clearBtn").onclick=function(){$("sms").value="";pend=[];$("pnote").hidden=true;drawPend()};
function pedit(e){
  var r=e.target.closest(".pr");if(!r)return;
  var f=e.target.getAttribute("data-f");if(!f)return;
  var x=pend[+r.getAttribute("data-i")];
  if(f==="on")x.on=e.target.checked;
  else if(f==="amount")x.amount=parseFloat(e.target.value)||0;
  else x[f]=e.target.value;
  if(e.type==="change"&&(f==="cat"||f==="on"))drawPend();
}
$("pend").addEventListener("input",pedit);
$("pend").addEventListener("change",pedit);
$("pAdd").onclick=function(){
  var sel=pend.filter(function(x){return x.on});
  var bad=sel.filter(function(x){return !x.cat||!(x.amount>0)});
  if(bad.length){$("pnote").hidden=false;$("pnote").textContent="Pick a category (and a valid amount) for the rows marked in red, or untick them.";drawPend();return}
  if(!sel.length)return;
  sel.forEach(function(x){items.push({id:Date.now()+""+Math.floor(Math.random()*99999),amount:x.amount,cat:x.cat,note:x.note.trim(),date:x.date,sms:x.raw})});
  save();
  var d=new Date(sel[0].date+"T00:00");d.setDate(1);cur=d;
  $("pnote").hidden=false;$("pnote").textContent="Added "+sel.length+(sel.length===1?" expense.":" expenses.");
  pend=[];$("sms").value="";drawPend();render();
};

function parseCSV(t){
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.length>1||row[0]!=="")rows.push(row);row=[]}
    else f+=ch}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
$("import").onclick=function(){$("csvfile").click()};
$("csvfile").onchange=function(){
  var file=this.files[0];this.value="";if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    var rows=parseCSV(String(r.result).replace(/^\uFEFF/,"")),add=0,skip=0;
    rows.forEach(function(c,i){
      if(i===0&&/^date$/i.test(c[0]))return;
      var x={amount:parseFloat(c[3]),date:(c[0]||"").trim(),cat:(c[1]||"Other").trim(),note:(c[2]||"").trim(),sms:(c[4]||"").trim()};
      if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!(x.amount>0)||dupe(x)){skip++;return}
      x.id=Date.now()+""+Math.floor(Math.random()*99999)+i;
      if(!x.sms)delete x.sms;
      items.push(x);add++});
    save();render();
    setSt("Imported "+add+(add===1?" expense":" expenses")+(skip?" · "+skip+" skipped (repeats or invalid rows)":""));
  };
  r.readAsText(file);
};
load();$("date").value=today();if(budget)$("budget").value=budget;render();setSt(MSG);
</script>
